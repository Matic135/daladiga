<!-- =========================
     NASLOV STRANI
========================= -->
<h2>Shopping List</h2>


<!-- Logout -->
<a href="/logout">Logout</a>

<hr>


<!-- =========================
     DODAJANJE IZDELKA
========================= -->
<h3>Dodaj izdelek</h3>

<!-- Input -->
<input id="itemInput" placeholder="npr. mleko">

<!-- Gumb -->
<button onclick="addItem()">
    Dodaj
</button>

<hr>


<!-- =========================
     SEZNAM IZDELKOV
========================= -->
<h3>Seznam</h3>

<div id="items">

    <!-- Flask loop -->
    {% for i in items %}

    <div id="item{{i.doc_id}}">

        <!-- Ime izdelka -->
        <p>{{i.name}}</p>


        <!-- Status -->
        <p>

            Status:

            <span id="status{{i.doc_id}}">

                {% if i.done %}

                    KUPLJENO

                {% else %}

                    NI KUPLJENO

                {% endif %}

            </span>

        </p>


        <!-- Done button -->
        <button onclick="doneItem({{i.doc_id}})">
            Done
        </button>


        <!-- Delete button -->
        <button onclick="deleteItem({{i.doc_id}})">
            Delete
        </button>

        <hr>

    </div>

    {% endfor %}

</div>



<!-- =========================
     JQUERY
========================= -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>



<!-- =========================
     JAVASCRIPT
========================= -->
<script>


// =========================
// DODAJ ITEM
// =========================
function addItem(){

    $.ajax({

        url: "/add_item",

        method: "POST",

        // Pošljemo ime izdelka
        data: {
            name: $("#itemInput").val()
        },

        // Če uspe
        success: function(res){

            // Dodamo nov item v HTML
            $("#items").append(`

                <div id="item${res.id}">

                    <p>${res.name}</p>

                    <p>
                        Status:
                        <span id="status${res.id}">
                            NI KUPLJENO
                        </span>
                    </p>

                    <button onclick="doneItem(${res.id})">
                        Done
                    </button>

                    <button onclick="deleteItem(${res.id})">
                        Delete
                    </button>

                    <hr>

                </div>

            `)

            // Spraznimo input
            $("#itemInput").val("")
        }

    })

}



// =========================
// DONE ITEM
// =========================
function doneItem(id){

    $.ajax({

        url: "/done_item",

        method: "POST",

        // Pošljemo ID
        data: {
            id: id
        },

        // Če uspe
        success: function(){

            // Spremenimo status
            $("#status" + id).text("KUPLJENO")

            // Zmanjšamo opacity
            $("#item" + id).css("opacity", "0.5")
        }

    })

}



// =========================
// DELETE ITEM
// =========================
function deleteItem(id){

    $.ajax({

        url: "/delete_item",

        method: "POST",

        // Pošljemo ID
        data: {
            id: id
        },

        // Če uspe
        success: function(){

            // Izbrišemo item
            $("#item" + id).remove()
        }

    })

}

</script>
