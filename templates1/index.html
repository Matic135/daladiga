<!DOCTYPE html>
<html>
<head>
    <title>Zapiski</title>
</head>
<body>

<h1>Pozdravljen {{ username }}</h1>

<a href="/logout">Logout</a>

<hr>

<h2>Dodaj zapisek</h2>

<input
    type="text"
    id="title"
    placeholder="Naslov"
>

<br><br>

<textarea
    id="content"
    placeholder="Vsebina"
></textarea>

<br><br>

<button onclick="addNote()">
    Dodaj
</button>

<hr>

<h2>Moji zapiski</h2>

{% for note in notes %}

<div style="border:1px solid black; padding:10px; margin:10px;">

    <h3>{{ note.title }}</h3>

    <p>{{ note.content }}</p>

    <button onclick="editNote('{{ note.doc_id }}')">
        Uredi
    </button>

    <button onclick="deleteNote('{{ note.doc_id }}')">
        Izbriši
    </button>

</div>

{% endfor %}


<script>

async function addNote() {

    let title =
        document.getElementById("title").value;

    let content =
        document.getElementById("content").value;

    await fetch("/add_note", {
        method: "POST",
        headers: {
            "Content-Type":
            "application/json"
        },
        body: JSON.stringify({
            title: title,
            content: content
        })
    });

    location.reload();
}


async function deleteNote(id) {

    await fetch(
        "/delete_note/" + id,
        {
            method: "POST"
        }
    );

    location.reload();
}


async function editNote(id) {

    let title =
        prompt("Nov naslov:");

    let content =
        prompt("Nova vsebina:");

    if (title == null || content == null) {
        return;
    }

    await fetch(
        "/edit_note/" + id,
        {
            method: "POST",
            headers: {
                "Content-Type":
                "application/json"
            },
            body: JSON.stringify({
                title: title,
                content: content
            })
        }
    );

    location.reload();
}

</script>

</body>
</html>
