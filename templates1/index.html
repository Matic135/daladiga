<!DOCTYPE html>
<html>
<head>
    <title>Zapiski</title>
</head>
<body>

<!-- Izpišemo prijavljenega uporabnika -->
<h1>Pozdravljen {{ username }}</h1>

<!-- Odjava -->
<a href="/logout">Logout</a>

<hr>

<h2>Dodaj zapisek</h2>

<!-- Polje za naslov -->
<input
    type="text"
    id="title"
    placeholder="Naslov"
>

<br><br>

<!-- Polje za vsebino -->
<textarea
    id="content"
    placeholder="Vsebina"
></textarea>

<br><br>

<!-- Gumb za dodajanje -->
<button onclick="addNote()">
    Dodaj
</button>

<hr>

<h2>Moji zapiski</h2>

<!-- Jinja loop za prikaz vseh zapiskov -->
{% for note in notes %}

<div style="border:1px solid black; padding:10px; margin:10px;">

    <!-- Naslov zapiska -->
    <h3>{{ note.title }}</h3>

    <!-- Vsebina zapiska -->
    <p>{{ note.content }}</p>

    <!-- Gumb za urejanje -->
    <button onclick="editNote('{{ note.doc_id }}')">
        Uredi
    </button>

    <!-- Gumb za brisanje -->
    <button onclick="deleteNote('{{ note.doc_id }}')">
        Izbriši
    </button>

</div>

{% endfor %}


<script>

// DODAJANJE ZAPISKA

async function addNote() {

    // Preberemo naslov
    let title =
        document.getElementById("title").value;

    // Preberemo vsebino
    let content =
        document.getElementById("content").value;

    // Pošljemo podatke Flasku kot JSON
    await fetch("/add_note", {
        method: "POST",
        headers: {
            "Content-Type":
            "application/json"
        },
        body: JSON.stringify({
            title: title,
            content: content
        })
    });

    // Osvežimo stran
    location.reload();
}


// BRISANJE ZAPISKA

async function deleteNote(id) {

    // Pošljemo POST zahtevo na delete route
    await fetch(
        "/delete_note/" + id,
        {
            method: "POST"
        }
    );

    // Osvežimo stran
    location.reload();
}


// UREJANJE ZAPISKA

async function editNote(id) {

    // Uporabnik vnese nov naslov
    let title =
        prompt("Nov naslov:");

    // Uporabnik vnese novo vsebino
    let content =
        prompt("Nova vsebina:");

    // Če prekliče prompt
    if (title == null || content == null) {
        return;
    }

    // Pošljemo nove podatke Flasku
    await fetch(
        "/edit_note/" + id,
        {
            method: "POST",
            headers: {
                "Content-Type":
                "application/json"
            },
            body: JSON.stringify({
                title: title,
                content: content
            })
        }
    );

    // Osvežimo stran
    location.reload();
}

</script>

</body>
</html>
