<h2>Zapiski</h2>

<a href="/logout">Logout</a>

<hr>

<h3>Dodaj zapisek</h3>

<form method="POST" action="/add">

<input name="title"><br><br>
<textarea name="content"></textarea><br><br>

<button>Dodaj</button>

</form>

<hr>

<h3>Seznam</h3>

{% for note in notes %}

<div>

<h4>{{note.title}}</h4>
<p>{{note.content}}</p>

<a href="/delete/{{note.doc_id}}">Delete</a>

<hr>

</div>

{% endfor %}
